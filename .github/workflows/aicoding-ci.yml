name: AiCoding CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 0'

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - &checkout-platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - &resolve-skills-pin
        name: Resolve pinned Skills commit
        id: skills-pin
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD:CodingKit/agents/skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$commit"

      - &checkout-skills
        name: Checkout private Skills with read-only key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HU-JIAXUAN/Codex-Skills
          ref: ${{ steps.skills-pin.outputs.commit }}
          path: CodingKit/agents/skills
          fetch-depth: 0
          ssh-key: ${{ secrets.CODEX_SKILLS_DEPLOY_KEY }}

      - &initialize-submodules
        name: Initialize pinned recursive submodules
        shell: pwsh
        run: |
          $sshCommand = git -C CodingKit/agents/skills config --get core.sshCommand
          if ($LASTEXITCODE -ne 0) { throw 'Skills checkout did not configure SSH access' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GIT_SSH_COMMAND=$sshCommand"
          $env:GIT_SSH_COMMAND = $sshCommand
          git config --global core.longpaths true
          git config --global url.git@github.com:HU-JIAXUAN/Codex-Skills.git.insteadOf https://github.com/HU-JIAXUAN/Codex-Skills.git
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Report effective Go version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content go.mod -Raw), '(?m)^toolchain\s+(go\S+)\s*$')
          if (-not $match.Success) { throw 'go.mod has no toolchain directive' }
          $expected = $match.Groups[1].Value
          $actual = (go env GOVERSION).Trim()
          go version
          if ($actual -ne $expected) { throw "effective Go version $actual does not match go.mod toolchain $expected" }

      - name: Build Go CLI
        shell: cmd
        run: go build -o bin/aicoding.exe ./cmd/aicoding

      - name: AiCoding Full profile
        shell: cmd
        run: .\bin\aicoding.exe test --profile Full --json

      - name: Upload development test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-test-evidence
          path: test-results/
          if-no-files-found: error

  # Default auto was promoted after three consecutive successful release-gate runs on main.
  # Keep the explicit off seed and verify-reuse audit commands unchanged.
  release-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - *checkout-platform
      - *resolve-skills-pin
      - *checkout-skills
      - *initialize-submodules

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Report effective Go version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content go.mod -Raw), '(?m)^toolchain\s+(go\S+)\s*$')
          if (-not $match.Success) { throw 'go.mod has no toolchain directive' }
          $expected = $match.Groups[1].Value
          $actual = (go env GOVERSION).Trim()
          go version
          if ($actual -ne $expected) { throw "effective Go version $actual does not match go.mod toolchain $expected" }

      - name: Build Go CLI
        shell: cmd
        run: go build -o bin/aicoding.exe ./cmd/aicoding

      - name: Release test profile
        shell: cmd
        run: .\bin\aicoding.exe test --profile Release --reuse off --json

      - name: Audit Release Receipt reuse
        shell: cmd
        run: .\bin\aicoding.exe test --profile Release --verify-reuse --json

      - name: Upload Release gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-evidence
          path: test-results/
          if-no-files-found: error

  clean-clone-full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - *checkout-platform
      - *resolve-skills-pin
      - *checkout-skills
      - *initialize-submodules

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Report effective Go version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content go.mod -Raw), '(?m)^toolchain\s+(go\S+)\s*$')
          if (-not $match.Success) { throw 'go.mod has no toolchain directive' }
          $expected = $match.Groups[1].Value
          $actual = (go env GOVERSION).Trim()
          go version
          if ($actual -ne $expected) { throw "effective Go version $actual does not match go.mod toolchain $expected" }

      - name: Build Go CLI
        shell: cmd
        run: go build -o bin/aicoding.exe ./cmd/aicoding

      - name: Clean-clone Full Go tests
        shell: cmd
        run: .\bin\aicoding.exe fresh-clone --profile Full --json

  # workflow_dispatch is the explicit schedule-equivalent probe; pull_request and push never select this job.
  scheduled-doctor-perf:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - *checkout-platform
      - *resolve-skills-pin
      - *checkout-skills
      - *initialize-submodules

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Report effective Go version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content go.mod -Raw), '(?m)^toolchain\s+(go\S+)\s*$')
          if (-not $match.Success) { throw 'go.mod has no toolchain directive' }
          $expected = $match.Groups[1].Value
          $actual = (go env GOVERSION).Trim()
          go version
          if ($actual -ne $expected) { throw "effective Go version $actual does not match go.mod toolchain $expected" }

      - name: Build Go CLI
        shell: cmd
        run: go build -o bin/aicoding.exe ./cmd/aicoding

      - name: Scheduled doctor performance gate
        shell: pwsh
        run: |
          $output = & .\bin\aicoding.exe doctor perf --json
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath doctor-perf.json
          exit $exitCode

      - name: Upload doctor performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doctor-perf-evidence
          path: doctor-perf.json
          if-no-files-found: error
